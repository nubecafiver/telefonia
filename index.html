<title>Telefonía IP Cafiver</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Instrument+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#F4F6F9;--surface:#FFFFFF;--ink:#18212E;--muted:#5B6779;--line:#DDE3EB;--accent:#17614F;--alert:#B4372A;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
form{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 16px rgba(16,24,40,.08);padding:26px;display:flex;flex-direction:column;gap:10px}
.eb{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
h1{font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;font-weight:800;font-size:30px;margin:0;line-height:1.1}
p{margin:0 0 6px;color:var(--muted);font-size:14px;line-height:1.5}
input{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{font:inherit;font-weight:600;padding:10px 12px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#msg{color:var(--alert);min-height:1.2em;margin:0}
.ver{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:12.5px;margin:4px 0 0;border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body>
<form id="f" autocomplete="off">

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(clave) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
  const llave = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(SOBRE.s), iterations: SOBRE.it, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(SOBRE.iv) }, llave, b64(SOBRE.ct)));
}
async function entrar(clave, silencioso) {
  const b = document.getElementById("b"), m = document.getElementById("msg");
  b.disabled = true; m.textContent = silencioso ? "" : "Verificando…";
  try {
    const html = await abrir(clave);
    try { sessionStorage.setItem("tip-clave", clave); } catch (e) {}
    document.open(); document.write(html); document.close();
  } catch (e) {
    try { sessionStorage.removeItem("tip-clave"); } catch (x) {}
    m.textContent = silencioso ? "" : "Contraseña incorrecta. Revísala e intenta de nuevo.";
    b.disabled = false; document.getElementById("p").select();
  }
}
document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); const v = document.getElementById("p").value; if (v) entrar(v, false); });
let g = null; try { g = sessionStorage.getItem("tip-clave"); } catch (e) {}
if (g) entrar(g, true);
